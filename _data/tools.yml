# XrmToolBox tools. `nuget` is the package id on nuget.org (also used for the XrmToolBox
# Tool Library URL and the live download counter).
- name: Entity Fields Analyser
  icon: "📊"
  year: 2021
  nuget: EntityFieldsAnalyser
  github: https://github.com/AmraouiH/Entity-Field-Analyser
  downloads: 58640
  featured: true
  summary: >-
    A health report for any table: checks how much each field is actually used and shows it in charts,
    so you know which columns are worth keeping.

- name: Bulk Prefix/Suffix Fields Name
  icon: "🏷️"
  year: 2021
  nuget: BulkPrefixSuffixFieldsName
  github: https://github.com/AmraouiH/Prefix-Suffix-Fields-Name
  downloads: 20233
  featured: true
  summary: >-
    Adds a prefix or suffix to the display names of many fields in one go, instead of editing them one by one.

- name: Dataverse Cartographer
  icon: "🗺️"
  year: 2026
  nuget: DataverseCartographer
  github: https://github.com/AmraouiH/DataverseCartographer
  downloads: 157
  summary: >-
    An interactive map of a Dataverse org: tables and 1:N, N:1, N:N relationships filtered by solution or app,
    table → step → plugin chains from static assembly analysis, and form event → library → Web API chains.
    Exports to PNG, SVG, Mermaid, PlantUML and Excel.

- name: System Jobs Doctor
  icon: "🩺"
  year: 2026
  nuget: SystemJobsDoctor
  github: https://github.com/AmraouiH/SystemJobsDoctor
  downloads: 115
  summary: >-
    Diagnoses and cleans up system jobs: exact counts past the 50,000-row aggregate limit, errors grouped by cause,
    plugin trace logs by correlation id, and bulk resume, cancel, postpone or delete with ExecuteMultiple.

- name: Dataverse Record Recovery
  icon: "♻️"
  year: 2026
  nuget: DataverseRecordRecovery
  github: https://github.com/AmraouiH/DataverseRecordRecovery
  downloads: 355
  summary: >-
    Restores deleted records from the audit history with their original GUID, including cascade-deleted children,
    N:N associations, lookups and status. Shows the full restore plan before writing anything.

- name: Solution Component Extractor
  icon: "🧩"
  year: 2026
  nuget: SolutionComponentExtractor
  github: https://github.com/AmraouiH/SolutionComponentExtractor
  downloads: 440
  summary: >-
    Builds a sub-solution from an exported unmanaged solution to ship only a hotfix or one feature:
    pick components, preview customizations.xml live, clean dependencies, then export the .zip or import it directly.

- name: MergeIt – Record Merger
  icon: "🔀"
  year: 2026
  nuget: MergeIt-RecordMergerForDataverse
  github: https://github.com/AmraouiH/MergeIt
  downloads: 132
  summary: >-
    Merges two records field by field with a side-by-side comparison: transactional merge or native Dataverse merge
    (account, contact, lead, incident), with optional re-parenting of child records.

