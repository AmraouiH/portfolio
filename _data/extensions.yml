# Browser extensions. Fill `store` with the Chrome Web Store URL once the listing is live.
- name: Form Analyzer for Dynamics 365
  icon: "🔎"
  year: 2026
  store: ""
  privacy: https://amraouih.github.io/
  summary: >-
    A Chrome extension (Manifest V3) that reviews the model-driven form open in the active tab against Microsoft guidance,
    in one click.
  checks:
    - Form structure and performance
    - Subgrids and their views
    - Deprecated client APIs (Xrm.Page)
    - DOM and jQuery access, sync requests, OData v2
    - HTML web resources
    - Script load and run timing
  details: >-
    Export the report as standalone HTML or JSON, in English or French. Everything runs in the browser:
    no data is collected or sent anywhere.
